<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OLTE App · prototyp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/olte.css">
<script src="assets/theme.js"></script>
<style>
  :root {
    --canvas: #101614;
    --canvas-2: #1b2320;
    --canvas-line: #2c3733;
    --canvas-fg: #f4f7f6;
    --canvas-text: #a8b5b0;
    --canvas-text-2: #c3cdc9;
    --bezel-a: #37423e;
    --bezel-b: #171f1c;
  }
  html, body {
    background: var(--canvas);
    color: var(--canvas-fg);
    min-height: 100vh;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 28px 20px 40px;
    box-sizing: border-box;
  }
  .toolbar {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; max-width: 460px;
    margin-bottom: 22px;
  }
  .toolbar-brand {
    display: flex; align-items: center; gap: 8px;
    font-family: var(--font-display); font-weight: 800; font-size: var(--fs-15);
    color: var(--canvas-fg); letter-spacing: -.01em;
    margin-right: auto;
  }
  .toolbar-brand svg { width: 18px; height: 18px; color: var(--primary-300); }
  .ds-link {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 9px 16px; border-radius: var(--r-pill);
    background: var(--canvas-2); border: 1px solid var(--canvas-line);
    font-family: var(--font-body); font-weight: 600; font-size: var(--fs-13);
    color: var(--canvas-fg); text-decoration: none;
    transition: background .15s ease, border-color .15s ease;
  }
  .ds-link:hover { background: color-mix(in oklch, var(--primary-500) 26%, var(--canvas-2)); border-color: var(--primary-300); }
  .ds-link svg { width: 15px; height: 15px; color: var(--primary-300); }

  .stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
  }

  /* Desktop / tablet — telefon jako wycentrowana ramka */
  /* Ramka musi być dokładnie tak szeroka/wysoka jak realny ekran (--screen-w/--screen-h
     z olte.css = 393×852), inaczej iframe renderuje treść szerszą niż jego viewport
     i przeglądarka dodaje suwaki przewijania w środku telefonu. */
  .bezel {
    width: 417px;
    padding: 12px;
    border-radius: 52px;
    background: linear-gradient(160deg, var(--bezel-a), var(--bezel-b) 60%);
    box-shadow: 0 34px 70px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.06);
    box-sizing: border-box;
  }
  .bezel iframe {
    display: block; width: 393px; height: 852px;
    max-width: 100%;
    border: 0; border-radius: 40px; background: var(--bg);
  }

  .hint {
    margin-top: 18px;
    font-family: var(--font-body); font-size: var(--fs-12); color: var(--canvas-text);
    text-align: center; max-width: 393px;
  }
  .hint code {
    font-family: var(--font-mono, monospace); font-size: var(--fs-11);
    color: var(--canvas-text-2); background: var(--canvas-2);
    padding: 2px 5px; border-radius: 4px;
  }

  /* Mobile — pełny ekran, tylko prototyp. Żadnego widocznego chrome (marka/przyciski)
     nad ekranem — to ma wyglądać i działać jak natywna aplikacja, nie strona.
     Nawigacja do DS / galerii ekranów przenosi się do jednego, dyskretnego
     przycisku typu FAB w rogu, nad treścią prototypu. */
  @media (max-width: 500px) {
    html, body { height: 100%; min-height: 100dvh; }
    body { padding: 0; }
    .toolbar { display: none; }
    .stage {
      width: 100vw; height: 100dvh;
    }
    .bezel {
      width: 100%; height: 100%; padding: 0; border-radius: 0;
      background: none; box-shadow: none;
    }
    .bezel iframe { width: 100%; height: 100%; border-radius: 0; }
    .hint { display: none; }

    .fab-menu { display: flex; }
  }

  /* FAB — ukryty na desktopie (tam nawigację obsługuje .toolbar), widoczny tylko
     jako pływający przycisk na mobile, żeby ekran prototypu został nienaruszony. */
  .fab-menu {
    display: none;
    position: fixed; top: max(10px, env(safe-area-inset-top));
    right: 10px; z-index: 50;
    flex-direction: column; align-items: flex-end; gap: 8px;
  }
  .fab-toggle {
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: color-mix(in oklch, var(--canvas-2) 88%, transparent);
    border: 1px solid var(--canvas-line);
    color: var(--canvas-fg);
    box-shadow: 0 6px 18px rgba(0,0,0,.35);
    -webkit-tap-highlight-color: transparent;
  }
  .fab-toggle svg { width: 18px; height: 18px; }
  .fab-panel {
    display: none;
    flex-direction: column; gap: 6px;
    padding: 8px; border-radius: 14px;
    background: color-mix(in oklch, var(--canvas-2) 92%, transparent);
    border: 1px solid var(--canvas-line);
    box-shadow: 0 10px 26px rgba(0,0,0,.4);
  }
  .fab-panel.is-open { display: flex; }
  .fab-panel a {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 12px; border-radius: 10px;
    font-family: var(--font-body); font-weight: 600; font-size: var(--fs-13);
    color: var(--canvas-fg); text-decoration: none; white-space: nowrap;
  }
  .fab-panel a:active { background: color-mix(in oklch, var(--primary-500) 26%, transparent); }
  .fab-panel a svg { width: 15px; height: 15px; color: var(--primary-300); }
</style>
</head>
<body>
<script src="assets/icons.js"></script>

<div class="toolbar" data-od-id="belka-narzedziowa">
  <span class="toolbar-brand"><svg viewBox="0 0 24 24"><use href="#i-thermometer"/></svg>OLTE</span>
  <a class="ds-link" href="screens-overview.html" data-od-id="link-wszystkie-ekrany" aria-label="Wszystkie ekrany">
    <svg viewBox="0 0 24 24"><use href="#i-layout-grid"/></svg><span class="label">Wszystkie ekrany</span></a>
  <a class="ds-link" href="design-system.html" data-od-id="link-design-system" aria-label="Design system">
    <svg viewBox="0 0 24 24"><use href="#i-cpu"/></svg><span class="label">Design system</span></a>
</div>

<div class="stage" data-od-id="scena">
  <div class="bezel" data-od-id="ramka-telefonu">
    <iframe src="screens/05-ekran-startowy.html" title="Prototyp OLTE App" loading="eager"></iframe>
  </div>
</div>

<p class="hint" data-od-id="podpowiedz">Klikalny prototyp — nawigacja działa w całości wewnątrz ekranu telefonu.</p>

<div class="fab-menu" data-od-id="menu-mobilne">
  <div class="fab-panel" id="fab-panel" data-od-id="panel-mobilny">
    <a href="screens-overview.html" data-od-id="link-wszystkie-ekrany-mobile"><svg viewBox="0 0 24 24"><use href="#i-layout-grid"/></svg>Wszystkie ekrany</a>
    <a href="design-system.html" data-od-id="link-design-system-mobile"><svg viewBox="0 0 24 24"><use href="#i-cpu"/></svg>Design system</a>
  </div>
  <button type="button" class="fab-toggle" id="fab-toggle" aria-label="Menu prototypu" aria-expanded="false" aria-controls="fab-panel">
    <svg viewBox="0 0 24 24"><use href="#i-ellipsis"/></svg>
  </button>
</div>

<script>
  (function () {
    var toggle = document.getElementById('fab-toggle');
    var panel = document.getElementById('fab-panel');
    if (!toggle || !panel) return;
    toggle.addEventListener('click', function () {
      var open = panel.classList.toggle('is-open');
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    document.addEventListener('click', function (e) {
      if (!panel.classList.contains('is-open')) return;
      if (panel.contains(e.target) || toggle.contains(e.target)) return;
      panel.classList.remove('is-open');
      toggle.setAttribute('aria-expanded', 'false');
    });
  })();
</script>

</body>
</html>
